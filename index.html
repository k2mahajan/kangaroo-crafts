<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kangaroo Crafts — Coming Soon</title>
<link rel="icon" type="image/png" href="assets/logo.png" />
<meta name="description" content="Kangaroo Crafts is hopping your way soon. A pouch full of creative DIY kits, gifts, and fun is on the way." />
<style>
  :root {
    --orange: #f0891f;
    --orange-dark: #d9720f;
    --orange-light: #ffb066;
    --brown: #4a2e1e;
    --brown-soft: #7a5240;
    --cream: #fff8f0;
    --white: #ffffff;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 20% 15%, #fff3e4 0%, var(--cream) 45%, #ffe6cc 100%);
    overflow-x: hidden;
    position: relative;
  }

  /* Decorative floating paw-print / blob shapes */
  .bg-blob {
    position: absolute;
    border-radius: 50%;
    opacity: 0.25;
    filter: blur(2px);
    z-index: 0;
  }
  .bg-blob.b1 { width: 260px; height: 260px; top: -80px; left: -80px; background: var(--orange-light); }
  .bg-blob.b2 { width: 320px; height: 320px; bottom: -120px; right: -100px; background: var(--orange); opacity: 0.18; }
  .bg-blob.b3 { width: 140px; height: 140px; top: 65%; left: 6%; background: var(--brown-soft); opacity: 0.08; }
  .bg-blob.b4 { width: 90px; height: 90px; top: 10%; right: 12%; background: var(--orange); opacity: 0.15; }

  .paw {
    position: absolute;
    font-size: 28px;
    opacity: 0.18;
    color: var(--orange-dark);
    z-index: 0;
    user-select: none;
  }
  .paw.p1 { top: 18%; left: 10%; transform: rotate(-15deg); }
  .paw.p2 { top: 75%; left: 18%; transform: rotate(10deg); font-size: 22px; }
  .paw.p3 { top: 30%; right: 8%; transform: rotate(20deg); font-size: 20px; }
  .paw.p4 { top: 80%; right: 14%; transform: rotate(-10deg); font-size: 24px; }

  .card {
    position: relative;
    z-index: 1;
    background: var(--white);
    border-radius: 28px;
    padding: 56px 48px 40px;
    max-width: 560px;
    width: 90%;
    text-align: center;
    box-shadow: 0 30px 60px -20px rgba(74, 46, 30, 0.25), 0 0 0 1px rgba(240, 137, 31, 0.08);
    animation: fadeUp 0.8s ease-out both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /*
    The kangaroo bounds in from off-screen left, lands on the ground beside
    the wordmark, leaps up onto it, pauses, drops down to the ground on the
    right and bounds off. After a short beat the next one enters.
    The arcs are deliberately tall and narrow: a high jumper, not a long one.
    Horizontal travel and vertical hopping live on two nested elements so
    each can have its own timing: the outer element slides, the inner one
    arcs and squashes.
  */
  .logo-stage {
    position: relative;
    width: 100%;
    max-width: 464px;
    margin: 0 auto 8px;
    padding-top: 192px;
    overflow: hidden;
  }

  .logo-stage .logo-text {
    display: block;
    width: 210px;
    height: auto;
    object-fit: contain;
    margin: 0 auto;
  }

  .roo-travel {
    position: absolute;
    bottom: 0;
    left: -34%;
    width: 168px;
    animation: roo-travel 5.6s linear infinite;
  }

  .roo-hop {
    display: block;
    width: 100%;
    height: auto;
    object-fit: contain;
    transform-origin: bottom center;
    animation: roo-hop 5.6s linear infinite;
  }

  /* Horizontal path: slides during each leap, holds still while on the wordmark. */
  @keyframes roo-travel {
    0%   { left: -34%; opacity: 0; }
    2%   { left: -34%; opacity: 1; }
    15%  { left: -2%; }
    19%  { left: -2%; }
    36%  { left: 33%; }
    54%  { left: 33%; }
    70%  { left: 69%; }
    74%  { left: 69%; }
    88%  { left: 102%; opacity: 1; }
    89%  { left: 102%; opacity: 0; }
    90%  { left: -34%; opacity: 0; }
    100% { left: -34%; opacity: 0; }
  }

  /*
    Vertical arcs. translateY is a percentage of the kangaroo's own height,
    so the whole routine rescales automatically at smaller sizes.
    Each leap pushes off with a decelerating curve, hangs at the apex, falls
    with an accelerating one, and squashes on landing.
  */
  @keyframes roo-hop {
    0%    { transform: translateY(0) scale(1, 1); animation-timing-function: ease-in; }
    2%    { transform: translateY(0) scale(1.1, 0.91); animation-timing-function: cubic-bezier(0.1, 0.9, 0.2, 1); }
    8.5%  { transform: translateY(-50%) scale(0.94, 1.07); animation-timing-function: ease-in; }
    15%   { transform: translateY(0) scale(1.11, 0.89); animation-timing-function: ease-out; }
    17%   { transform: translateY(0) scale(1, 1); animation-timing-function: ease-in; }
    19%   { transform: translateY(0) scale(1.12, 0.88); animation-timing-function: cubic-bezier(0.1, 0.9, 0.2, 1); }
    27%   { transform: translateY(-88%) scale(0.93, 1.08); animation-timing-function: ease-in; }
    36%   { transform: translateY(-37%) scale(1.11, 0.89); animation-timing-function: ease-out; }
    40%   { transform: translateY(-37%) scale(1, 1); animation-timing-function: ease-in-out; }
    47%   { transform: translateY(-37%) scale(1.012, 0.988); animation-timing-function: ease-in-out; }
    52%   { transform: translateY(-37%) scale(1, 1); animation-timing-function: ease-in; }
    54%   { transform: translateY(-37%) scale(1.1, 0.9); animation-timing-function: cubic-bezier(0.1, 0.9, 0.2, 1); }
    62%   { transform: translateY(-88%) scale(0.93, 1.08); animation-timing-function: ease-in; }
    70%   { transform: translateY(0) scale(1.12, 0.88); animation-timing-function: ease-out; }
    72%   { transform: translateY(0) scale(1, 1); animation-timing-function: ease-in; }
    74%   { transform: translateY(0) scale(1.1, 0.91); animation-timing-function: cubic-bezier(0.1, 0.9, 0.2, 1); }
    81%   { transform: translateY(-50%) scale(0.94, 1.07); animation-timing-function: ease-in; }
    88%   { transform: translateY(0) scale(1.1, 0.9); animation-timing-function: ease-out; }
    90%   { transform: translateY(0) scale(1, 1); }
    100%  { transform: translateY(0) scale(1, 1); }
  }

  .message-box {
    background: transparent;
    border: 2px solid var(--orange);
    border-radius: 20px;
    padding: 26px 28px;
    margin: 18px 0 26px;
  }

  .message-box h1 {
    color: var(--brown);
    font-size: 26px;
    line-height: 1.3;
    margin: 0 0 10px;
    font-weight: 800;
    min-height: 68px;
  }

  .message-box p.subtitle {
    color: var(--brown-soft);
    font-size: 16px;
    line-height: 1.55;
    margin: 0 auto;
    max-width: 400px;
  }

  .badge {
    display: inline-block;
    background: linear-gradient(135deg, var(--orange), var(--orange-dark));
    color: var(--white);
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 10px 26px;
    border-radius: 999px;
    box-shadow: 0 10px 24px -8px rgba(217, 114, 15, 0.55);
  }

  footer {
    position: relative;
    z-index: 1;
    margin-top: 26px;
    text-align: center;
    color: var(--brown-soft);
    font-size: 13px;
    opacity: 0.8;
  }

  .wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
  }

  @media (max-width: 480px) {
    .card { padding: 40px 24px 32px; border-radius: 22px; }
    .logo-stage {
      max-width: 305px;
      padding-top: 126px;
    }
    .logo-stage .logo-text { width: 138px; }
    .roo-travel { width: 110px; }
    .message-box { padding: 22px 20px; }
    .message-box h1 { font-size: 21px; min-height: 88px; }
    .message-box p.subtitle { font-size: 14px; }
  }
</style>
</head>
<body>

  <div class="bg-blob b1"></div>
  <div class="bg-blob b2"></div>
  <div class="bg-blob b3"></div>
  <div class="bg-blob b4"></div>
  <div class="paw p1">🐾</div>
  <div class="paw p2">🐾</div>
  <div class="paw p3">🐾</div>
  <div class="paw p4">🐾</div>

  <div class="wrap">
    <div class="card">
      <div class="logo-stage">
        <div class="roo-travel">
          <img class="roo-hop" src="assets/logo_image.png" alt="Kangaroo Crafts kangaroo mascot" />
        </div>
        <img class="logo-text" src="assets/logo_text.png" alt="Kangaroo Crafts" />
      </div>

      <div class="message-box">
        <h1 id="headline"></h1>
        <p class="subtitle" id="subtitle"></p>
      </div>

      <span class="badge">Launching Soon</span>
    </div>

    <footer>&copy; <span id="year"></span> Kangaroo Crafts. All rights reserved.</footer>
  </div>

<script>
  const messages = [
    { title: "🦘 Our kangaroos are still packing the pouch...", subtitle: "Something awesome is hopping your way. Coming soon!" },
    { title: "Hop. Hop. Almost there.", subtitle: "Kangaroo Crafts is making its final leap before launch." },
    { title: "Mind the Bounce!", subtitle: "Our little kangaroo is busy crafting something amazing. Landing soon." },
    { title: "Currently Hopping Into Shape.", subtitle: "We're putting the finishing touches on Kangaroo Crafts. See you soon!" },
    { title: "The Roo Crew Is Hard at Work.", subtitle: "Cutting, crafting, packing... and hopping toward launch." },
    { title: "Pouch Full of Surprises.", subtitle: "We're filling it with creative DIY kits, gifts, and fun. Launching soon!" },
    { title: "Hold Your Hops!", subtitle: "The workshop is buzzing, the lasers are glowing, and our kangaroo is almost ready to bounce online." },
    { title: "One Giant Leap for DIY Lovers.", subtitle: "Kangaroo Crafts is hopping in soon." },
    { title: "The Kangaroo Hasn't Landed... Yet.", subtitle: "But when it does, expect a pouch full of creativity." },
    { title: "Warning: High Levels of Creativity Ahead.", subtitle: "Our kangaroo is warming up for the biggest hop yet. Coming soon!" }
  ];

  const pick = messages[Math.floor(Math.random() * messages.length)];
  document.getElementById("headline").textContent = pick.title;
  document.getElementById("subtitle").textContent = pick.subtitle;
  document.getElementById("year").textContent = new Date().getFullYear();
</script>

</body>
</html>
