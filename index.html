<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kangaroo Crafts — Coming Soon</title>
<link rel="icon" type="image/png" href="assets/logo.png" />
<meta name="description" content="Kangaroo Crafts is hopping your way soon. A pouch full of creative DIY kits, gifts, and fun is on the way." />
<style>
  :root {
    --orange: #f0891f;
    --orange-dark: #d9720f;
    --orange-light: #ffb066;
    --brown: #4a2e1e;
    --brown-soft: #7a5240;
    --cream: #fff8f0;
    --white: #ffffff;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 20% 15%, #fff3e4 0%, var(--cream) 45%, #ffe6cc 100%);
    overflow-x: hidden;
    position: relative;
  }

  /* Decorative floating paw-print / blob shapes */
  .bg-blob {
    position: absolute;
    border-radius: 50%;
    opacity: 0.25;
    filter: blur(2px);
    z-index: 0;
  }
  .bg-blob.b1 { width: 260px; height: 260px; top: -80px; left: -80px; background: var(--orange-light); }
  .bg-blob.b2 { width: 320px; height: 320px; bottom: -120px; right: -100px; background: var(--orange); opacity: 0.18; }
  .bg-blob.b3 { width: 140px; height: 140px; top: 65%; left: 6%; background: var(--brown-soft); opacity: 0.08; }
  .bg-blob.b4 { width: 90px; height: 90px; top: 10%; right: 12%; background: var(--orange); opacity: 0.15; }

  .paw {
    position: absolute;
    font-size: 28px;
    opacity: 0.18;
    color: var(--orange-dark);
    z-index: 0;
    user-select: none;
  }
  .paw.p1 { top: 18%; left: 10%; transform: rotate(-15deg); }
  .paw.p2 { top: 75%; left: 18%; transform: rotate(10deg); font-size: 22px; }
  .paw.p3 { top: 30%; right: 8%; transform: rotate(20deg); font-size: 20px; }
  .paw.p4 { top: 80%; right: 14%; transform: rotate(-10deg); font-size: 24px; }

  .card {
    position: relative;
    z-index: 1;
    background: var(--white);
    border-radius: 28px;
    padding: 56px 48px 40px;
    max-width: 560px;
    width: 90%;
    text-align: center;
    box-shadow: 0 30px 60px -20px rgba(74, 46, 30, 0.25), 0 0 0 1px rgba(240, 137, 31, 0.08);
    animation: fadeUp 0.8s ease-out both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .logo-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 8px;
  }

  .logo-wrap .logo-image {
    width: 175px;
    height: auto;
    object-fit: contain;
    animation: hop 1.5s linear infinite;
    transform-origin: bottom center;
  }

  .logo-wrap .logo-text {
    width: 210px;
    height: auto;
    object-fit: contain;
    margin-top: 6px;
  }

  /*
    Faster, punchier hop that still respects gravity:
    - a snappy crouch loads the jump (anticipation)
    - an explosive launch decelerates on the way up (ease-out) to a much higher peak
    - a short hang at the apex, where vertical velocity is near zero
    - an accelerating fall (ease-in) that is fastest at impact
    - a hard landing squash, a lively rebound hop, then a brief beat before repeating
  */
  @keyframes hop {
    0% {
      transform: translateY(0) scale(1, 1);
      animation-timing-function: ease-in;
    }
    7% {
      transform: translateY(5px) scale(1.2, 0.8);
      animation-timing-function: cubic-bezier(0.1, 0.9, 0.2, 1);
    }
    26% {
      transform: translateY(-46px) scale(0.88, 1.16);
      animation-timing-function: ease-out;
    }
    36% {
      transform: translateY(-52px) scale(0.95, 1.06);
      animation-timing-function: ease-in;
    }
    48% {
      transform: translateY(-44px) scale(0.92, 1.1);
      animation-timing-function: cubic-bezier(0.6, 0, 1, 0.5);
    }
    60% {
      transform: translateY(0) scale(0.85, 1.2);
      animation-timing-function: cubic-bezier(0.3, 0, 0.2, 1);
    }
    66% {
      transform: translateY(0) scale(1.28, 0.72);
      animation-timing-function: cubic-bezier(0.2, 0.9, 0.3, 1);
    }
    76% {
      transform: translateY(-14px) scale(0.95, 1.07);
      animation-timing-function: ease-in;
    }
    86% {
      transform: translateY(0) scale(1.12, 0.9);
      animation-timing-function: ease-out;
    }
    92% {
      transform: translateY(0) scale(0.98, 1.02);
      animation-timing-function: ease-in-out;
    }
    96%, 100% {
      transform: translateY(0) scale(1, 1);
    }
  }

  .message-box {
    background: transparent;
    border: 2px solid var(--orange);
    border-radius: 20px;
    padding: 26px 28px;
    margin: 18px 0 26px;
  }

  .message-box h1 {
    color: var(--brown);
    font-size: 26px;
    line-height: 1.3;
    margin: 0 0 10px;
    font-weight: 800;
    min-height: 68px;
  }

  .message-box p.subtitle {
    color: var(--brown-soft);
    font-size: 16px;
    line-height: 1.55;
    margin: 0 auto;
    max-width: 400px;
  }

  .badge {
    display: inline-block;
    background: linear-gradient(135deg, var(--orange), var(--orange-dark));
    color: var(--white);
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 10px 26px;
    border-radius: 999px;
    box-shadow: 0 10px 24px -8px rgba(217, 114, 15, 0.55);
  }

  footer {
    position: relative;
    z-index: 1;
    margin-top: 26px;
    text-align: center;
    color: var(--brown-soft);
    font-size: 13px;
    opacity: 0.8;
  }

  .wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  @media (max-width: 480px) {
    .card { padding: 40px 24px 32px; border-radius: 22px; }
    .logo-wrap .logo-image { width: 142px; }
    .logo-wrap .logo-text { width: 170px; }
    .message-box { padding: 22px 20px; }
    .message-box h1 { font-size: 21px; min-height: 88px; }
    .message-box p.subtitle { font-size: 14px; }
  }
</style>
</head>
<body>

  <div class="bg-blob b1"></div>
  <div class="bg-blob b2"></div>
  <div class="bg-blob b3"></div>
  <div class="bg-blob b4"></div>
  <div class="paw p1">🐾</div>
  <div class="paw p2">🐾</div>
  <div class="paw p3">🐾</div>
  <div class="paw p4">🐾</div>

  <div class="wrap">
    <div class="card">
      <div class="logo-wrap">
        <img class="logo-image" src="assets/logo_image.png" alt="Kangaroo Crafts kangaroo mascot" />
        <img class="logo-text" src="assets/logo_text.png" alt="Kangaroo Crafts" />
      </div>

      <div class="message-box">
        <h1 id="headline"></h1>
        <p class="subtitle" id="subtitle"></p>
      </div>

      <span class="badge">Launching Soon</span>
    </div>

    <footer>&copy; <span id="year"></span> Kangaroo Crafts. All rights reserved.</footer>
  </div>

<script>
  const messages = [
    { title: "🦘 Our kangaroos are still packing the pouch...", subtitle: "Something awesome is hopping your way. Coming soon!" },
    { title: "Hop. Hop. Almost there.", subtitle: "Kangaroo Crafts is making its final leap before launch." },
    { title: "Mind the Bounce!", subtitle: "Our little kangaroo is busy crafting something amazing. Landing soon." },
    { title: "Currently Hopping Into Shape.", subtitle: "We're putting the finishing touches on Kangaroo Crafts. See you soon!" },
    { title: "The Roo Crew Is Hard at Work.", subtitle: "Cutting, crafting, packing... and hopping toward launch." },
    { title: "Pouch Full of Surprises.", subtitle: "We're filling it with creative DIY kits, gifts, and fun. Launching soon!" },
    { title: "Hold Your Hops!", subtitle: "The workshop is buzzing, the lasers are glowing, and our kangaroo is almost ready to bounce online." },
    { title: "One Giant Leap for DIY Lovers.", subtitle: "Kangaroo Crafts is hopping in soon." },
    { title: "The Kangaroo Hasn't Landed... Yet.", subtitle: "But when it does, expect a pouch full of creativity." },
    { title: "Warning: High Levels of Creativity Ahead.", subtitle: "Our kangaroo is warming up for the biggest hop yet. Coming soon!" }
  ];

  const pick = messages[Math.floor(Math.random() * messages.length)];
  document.getElementById("headline").textContent = pick.title;
  document.getElementById("subtitle").textContent = pick.subtitle;
  document.getElementById("year").textContent = new Date().getFullYear();
</script>

</body>
</html>
